<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métricas - Avistamiento de Aves</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <main class="main-metricas">
        <h1>Métricas e Indicadores del Sistema</h1>
        <p>Visualización gráfica sobre los voluntarios y avistamientos registrados en el país.</p>

        <section class="contenedor-graficos">
            <div class="tarjeta-grafico">
                <h2>Avistamientos por dia</h2>
                <div class="canvas-contenedor">
                    <canvas id="chartAvistamientosDia"></canvas>
                </div>
            </div>

            <div class="tarjeta-grafico">
                <h2>Avistamientos por tipo de ave</h2>
                <div class="canvas-contenedor">
                    <canvas id="chartAvistamientosAves"></canvas>
                </div>
            </div>

            <div class="tarjeta-grafico">
                <h2>Voluntarios registrados por comuna</h2>
                <div class="canvas-contenedor">
                    <canvas id="chartVoluntariosComuna"></canvas>
                </div>
            </div>
        </section>

        <div class="campo" style="margin-top: 30px; text-align: center;">
            <a href="{{ url_for('index') }}" class="btn-enlace-portada">Volver a la Partida</a>
        </div>     
    </main>

    <footer>
        <p>Unión de Ornitólogos de Chile - Prototipo Sistema Web</p>
    </footer>

    <script src="{{ url_for('static', filename='js/metricas.js') }}"></script>
</body>
</html>
